name: Update visual baselines (manual)

# Generates the Linux screenshot baselines the CI visual-regression step compares against. It never commits anything: download the artifact, LOOK at the
# images, and commit them yourself if they are right. Run it again after an intentional UI change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @lifetrack/web exec playwright install --with-deps chromium
      - name: Generate baselines
        run: pnpm --filter @lifetrack/web test:visual:update
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: apps/web/e2e/visual.spec.js-snapshots/*-linux.png
          retention-days: 14
