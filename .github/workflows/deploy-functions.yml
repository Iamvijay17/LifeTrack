name: Deploy Edge Functions (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-functions-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Guard rails
        run: '[ -n "$PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Environment needs SUPABASE_PROJECT_REF (variable) and SUPABASE_ACCESS_TOKEN (secret)"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Shared reminder code is in sync with the function's copy
        run: node scripts/sync-function-core.mjs && git diff --exit-code -- supabase/functions/_shared
      - name: Deno tests (never deploy a function that fails its own tests)
        working-directory: supabase/functions/send-reminders
        run: deno test --config deno.json --allow-env --allow-net --allow-read index.test.ts
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # Secrets (CRON_SECRET, optional EXPO_ACCESS_TOKEN) are set once by hand with `supabase secrets set`, see docs/NATIVE.md.
      # CI deliberately never reads or writes them.
      - name: Deploy send-reminders
        run: supabase functions deploy send-reminders --project-ref "$PROJECT_REF" --no-verify-jwt
