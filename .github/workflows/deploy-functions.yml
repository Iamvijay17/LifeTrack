name: Deploy Edge Functions (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-functions-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Guard rails
        run: '[ -n "$PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Environment needs SUPABASE_PROJECT_REF (variable) and SUPABASE_ACCESS_TOKEN (secret)"; exit 1; }'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Shared reminder code is in sync with the function's copy
        run: node scripts/sync-function-core.mjs && git diff --exit-code -- supabase/functions/_shared
      - name: Deno tests (never deploy a function that fails its own tests)
        working-directory: supabase/functions/send-reminders
        run: deno test --config deno.json --allow-env --allow-net --allow-read index.test.ts
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      # Secrets (CRON_SECRET, optional EXPO_ACCESS_TOKEN) are set once by hand with `supabase secrets set`, see docs/NATIVE.md.
      # CI deliberately never reads or writes them.
      - name: Deploy send-reminders
        run: supabase functions deploy send-reminders --project-ref "$PROJECT_REF" --no-verify-jwt
      # The other functions, each with the JWT setting its own header documents. `--no-verify-jwt` ones check the caller themselves (API key,
      # CRON_SECRET or a signed OAuth state); the rest need a signed-in user's token. Run the database migrations first (db-migrate.yml): the
      # api/webhook-dispatch functions need 0027, device-key 0014, webauthn 0012, the Google ones 0026. Their secrets are set by hand, see
      # docs/WEBHOOKS_API.md, docs/APP_SECURITY.md and docs/INTEGRATIONS.md. A function whose secrets are not set yet still deploys and answers
      # "not configured" until they are.
      - name: Deploy api (public REST API, API-key auth)
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy webhook-dispatch (scheduler with CRON_SECRET, or a signed-in user)
        run: supabase functions deploy webhook-dispatch --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy webauthn (passkeys)
        run: supabase functions deploy webauthn --project-ref "$PROJECT_REF"
      - name: Deploy device-key (phone biometric unlock)
        run: supabase functions deploy device-key --project-ref "$PROJECT_REF"
      - name: Deploy google-integration
        run: supabase functions deploy google-integration --project-ref "$PROJECT_REF"
      - name: Deploy google-oauth-callback (browser redirect from Google, trusts only the signed state)
        run: supabase functions deploy google-oauth-callback --project-ref "$PROJECT_REF" --no-verify-jwt
