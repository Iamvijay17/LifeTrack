name: Mobile builds
# Builds the Android APK and an unsigned iOS .ipa from the same web app (Capacitor).
# Run manually (Actions -> Mobile builds -> Run workflow) or push a tag like v1.0.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write # needed only to attach files to a Release
env:
  # Set these in Settings -> Secrets and variables -> Actions. Use ONLY the anon/publishable key.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run mobile:sync
      - name: Build debug APK (installable on any phone, not for Play Store)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: android/app/build/outputs/apk/debug/*.apk }

  ios:
    name: iOS (unsigned .ipa)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run mobile:sync
      - name: Build without code signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry LifeTrack-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-ios-unsigned-ipa
          path: LifeTrack-unsigned.ipa
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: LifeTrack-unsigned.ipa }
