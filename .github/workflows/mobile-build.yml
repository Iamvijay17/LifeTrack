name: Mobile build (EAS)

# Needs the EXPO_TOKEN secret (Settings > Secrets and variables > Actions) and a finished `eas init` (docs/NATIVE.md). Without the token
# the first step FAILS WITH A CLEAR MESSAGE instead of skipping silently. Builds are manual or tag-triggered; nothing is submitted to a store.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
  push:
    tags: ['mobile-v*']   # tag builds use the preview profile; production is only ever started by hand

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: eas build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The 'production' Environment should have required reviewers (Settings > Environments) so a production build needs approval.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile == 'production') && 'production' || 'preview' }}
    env:
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }}
      PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'android' }}
    steps:
      - name: Check prerequisites
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=EXPO_TOKEN is missing::Create an access token at expo.dev > Account settings > Access tokens, then add it as a repository secret named EXPO_TOKEN (Settings > Secrets and variables > Actions). Also run 'eas init' once in apps/mobile and set the EAS environment variables (docs/NATIVE.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Legal documents are finished (production only)
        if: ${{ env.PROFILE == 'production' }}
        run: node scripts/check-legal-ready.mjs

      # The same gates as the PR workflow, so a build never starts from a broken or leaky tree.
      - run: pnpm typecheck
      - run: pnpm check:secrets
      - run: pnpm --filter @lifetrack/mobile test

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start the EAS build (runs on Expo's servers; follow it from the link in the log)
        working-directory: apps/mobile
        run: eas build --non-interactive --no-wait --profile "$PROFILE" --platform "$PLATFORM"
