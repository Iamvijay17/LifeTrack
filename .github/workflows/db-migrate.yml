name: Database migrations (manual)

# NEVER runs automatically. Pushes supabase/migrations to a hosted project only when a human starts it, the target GitHub Environment
# approves it, and the migration safety check passes. Default is a DRY RUN: run it once to read the plan, then run again with apply=true.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment (holds that project's secrets)
        type: choice
        options: [staging, production]
        default: staging
      first_pending:
        description: 'First migration that is NOT yet on the target, e.g. 0005 (every migration from here on is safety-checked)'
        type: string
        required: true
      apply:
        description: Apply for real (leave off for a dry run)
        type: boolean
        default: false
      allow_destructive:
        description: I have reviewed the destructive statements the safety check reported
        type: boolean
        default: false
      confirm:
        description: 'Production + apply only: type  apply-production'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}   # configure required reviewers on 'production'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      # Inputs go through the environment, never interpolated into shell text.
      TARGET: ${{ inputs.environment }}
      APPLY: ${{ inputs.apply }}
      ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}
      FIRST_PENDING: ${{ inputs.first_pending }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Guard rails
        run: |
          [ -n "$PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::The '$TARGET' Environment needs the variable SUPABASE_PROJECT_REF and the secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD"; exit 1; }
          if [ "$APPLY" = "true" ] && [ "$TARGET" = "production" ] && [ "$CONFIRM" != "apply-production" ]; then
            echo "::error::Applying to production requires confirm = apply-production"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - name: Migration safety check (destructive statements need explicit approval)
        run: |
          if [ "$ALLOW_DESTRUCTIVE" = "true" ]; then
            node scripts/check-migration-safety.mjs --from "$FIRST_PENDING" || echo "::warning::Destructive statements were reported and accepted via allow_destructive"
          else
            node scripts/check-migration-safety.mjs --from "$FIRST_PENDING"
          fi

      - name: setup-all.sql matches the migrations
        run: node scripts/build-setup-sql.mjs && git diff --exit-code -- supabase/setup-all.sql

      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Migration history before (local vs remote)
        run: supabase migration list

      - name: Dry run - what would be applied
        run: supabase db push --dry-run

      - name: Apply
        if: ${{ inputs.apply }}
        run: supabase db push

      - name: Migration history after
        if: ${{ inputs.apply }}
        run: supabase migration list
