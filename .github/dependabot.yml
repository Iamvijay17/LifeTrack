version: 2
updates:
  # JavaScript dependencies across the pnpm workspace (root, apps, packages, supabase/tests).
  - package-ecosystem: npm
    directories: ['/', '/apps/*', '/packages/*', '/supabase/tests']
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 8
    groups:
      # One PR for routine (minor/patch) updates.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['expo*', '@expo/*', 'react', 'react-dom', 'react-native*', 'react-test-renderer', '@react-native*', 'jest-expo', '@types/react']
    ignore:
      # Major upgrades (TypeScript 7, Tailwind 4, Recharts 3, Jest 30 ...) are breaking by definition and each needs a planned migration, so
      # they are done by hand, not as a stream of red pull requests. Remove this rule to see them again.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # These must move together with the Expo SDK (see `npx expo install --check`); upgrade them deliberately, never one at a time.
      - dependency-name: 'expo*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native*'
      - dependency-name: '@react-native*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'react-test-renderer'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'

  # Workflow actions (pinned by major tag today; see docs/CI.md about pinning to SHAs).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ['*'] }
