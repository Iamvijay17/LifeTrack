<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <meta name="description" content="LifeTrack - your personal life operating system" />
    <title>LifeTrack</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="lt-boot" role="status" aria-live="polite" aria-busy="true">
        <!-- Pre-JavaScript boot screen. Mirrors src/components/loaders/OrbitMark.jsx; React replaces it on mount. -->
        <svg class="lt-orbit" width="112" height="112" viewBox="0 0 120 120" fill="none" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="bg" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#7C3AED" stop-opacity=".55" />
              <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="bc" x1="36" y1="30" x2="84" y2="72" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#A78BFA" />
              <stop offset="1" stop-color="#7C3AED" />
            </linearGradient>
          </defs>
          <circle class="lt-glow" cx="60" cy="60" r="34" fill="url(#bg)" />
          <g class="lt-spin lt-spin-outer">
            <circle
              cx="60"
              cy="60"
              r="54"
              stroke="var(--lt-a)"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-dasharray="92 36 22 36"
              opacity=".9"
            />
            <circle cx="60" cy="6" r="3.4" fill="var(--lt-c)" />
            <circle cx="60" cy="114" r="2.2" fill="var(--lt-b)" />
          </g>
          <g class="lt-spin lt-spin-inner">
            <circle
              cx="60"
              cy="60"
              r="41"
              stroke="var(--lt-b)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-dasharray="46 22"
              opacity=".75"
            />
            <circle cx="19" cy="60" r="2.8" fill="var(--lt-c)" />
            <circle cx="101" cy="60" r="2" fill="var(--lt-a)" />
          </g>
          <g transform="translate(1.5 11.5) scale(.2)" stroke="url(#bc)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
            <path class="lt-check" pathLength="1" d="M185 275L235 325L400 160" />
            <path class="lt-check" pathLength="1" d="M342 160H400V218" />
          </g>
        </svg>
        <span
          style="
            font:
              500 18px/1 system-ui,
              sans-serif;
            letter-spacing: -0.01em;
            color: rgb(var(--foreground));
          "
          >Life<b>Track</b></span
        >
        <p
          class="lt-msg"
          style="
            margin: 0;
            font:
              14px/1.4 system-ui,
              sans-serif;
            color: rgb(var(--muted-foreground));
          "
        >
          Preparing your dashboard...
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
